name: Sync

# Always-on sync worker for StyleSync Personal. Playwright (headless Chromium)
# can't run inside a Vercel serverless function, so the actual `stylesync
# sync` crawl runs here instead, against the same production Neon Postgres +
# Vercel Blob storage the hosted site (stylesync-kappa.vercel.app) reads
# from. Triggered on a schedule and on-demand (workflow_dispatch), the
# latter dispatched by the web app's "Sync now" button via the GitHub REST
# API (see apps/web/app/api/sync/route.ts).
on:
  schedule:
    # 06:00 UTC daily — adjust freely, this is a single-user personal tool.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source id to sync (blank = all sources)'
        required: false
        default: ''
      full:
        description: 'Full re-sync (ignore content-hash short-circuit)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      url:
        description: 'Ad-hoc URL to capture as a single reference (implies source=url; ignores "source"/"full" above)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: pnpm` here — pnpm-lock.yaml is gitignored in this
          # repo (not committed), and setup-node's cache option hard-fails
          # when it can't find a lockfile to key the cache against.

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @stylesync/core exec playwright install --with-deps chromium

      - name: Build workspace
        run: pnpm build

      - name: Run sync
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # Passed as env vars rather than interpolated directly into the
          # script below — inputs are free-text (especially `url`), and
          # substituting `${{ github.event.inputs.* }}` straight into a
          # shell run: block is a known script-injection risk in GitHub
          # Actions. Reading them back as $SOURCE_INPUT etc. avoids that.
          SOURCE_INPUT: ${{ github.event.inputs.source }}
          FULL_INPUT: ${{ github.event.inputs.full }}
          URL_INPUT: ${{ github.event.inputs.url }}
        run: |
          ARGS=()
          if [ -n "$URL_INPUT" ]; then
            ARGS+=(--add "$URL_INPUT")
          else
            if [ -n "$SOURCE_INPUT" ]; then
              ARGS+=(--source "$SOURCE_INPUT")
            fi
            if [ "$FULL_INPUT" = "true" ]; then
              ARGS+=(--full)
            fi
          fi
          node packages/cli/dist/index.js sync "${ARGS[@]}"
